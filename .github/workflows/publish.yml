name: Publish to npm

# Lives inside packages/ so the subtree mirror carries it into the public
# repo's own .github/workflows/ — it runs there, firing right after the private
# repo's mirror workflow pushes a version bump to this repo's main. Publishes
# via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret, no long-lived
# credential at all.
#
# ⚠️ Each package needs a one-time manual first publish (npm has no PyPI-style
# "reserve before it exists" flow) and its own Trusted Publisher configured on
# its npmjs.com settings page, pointing at this repo + THIS FILENAME. Keeping
# every package in one matrix inside one file is what lets them share that
# configuration shape — renaming this file breaks both.
# ⚠️ A SCOPED package (@pixi-rn/haptics) defaults to private on npm, so its
# first manual publish needs --access public.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: pixi-rn
            name: pixi-rn
          - dir: pixi-rn-haptics
            name: '@pixi-rn/haptics'
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI 11.5.1+; Node 22's bundled npm is
      # older than that, so upgrade it before anything else touches npm.
      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@latest
        working-directory: .

      # Every mirror sync pushes to main, not just version bumps — skip
      # publishing (rather than letting `npm publish` fail loudly) when the
      # current package.json version is already on the registry.
      - name: Check whether this version is already published
        id: check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "${{ matrix.name }}@$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "Already published: ${{ matrix.name }}@$CURRENT_VERSION"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet published: ${{ matrix.name }}@$CURRENT_VERSION"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm install

      # No NODE_AUTH_TOKEN: trusted publishing exchanges this job's OIDC
      # token (from id-token: write, above) for a short-lived npm publish
      # credential automatically. Provenance is published automatically
      # too, so --provenance isn't needed; --access public is a harmless
      # no-op today but protects a future move under an npm scope.
      - name: Publish
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
