name: Deploy docs

# Lives inside packages/ so the subtree mirror carries it into the public
# repo's own .github/workflows/ — it then runs as THAT repo's Actions, using
# its own GITHUB_TOKEN (no cross-repo PAT needed), firing right after the
# private repo's mirror workflow pushes new content to this repo's main.
# ⚠️ The split prefix is `packages`, so the public repo's ROOT is this folder:
# every path below is relative to it, and pixi-rn is a SUBDIRECTORY.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installs all three workspace members (pixi-rn, pixi-rn-haptics,
      # pixi-rn-sound) — docs-site's own prebuild (copy-api-docs.mjs)
      # regenerates each package's TypeDoc output itself via `npm run docs
      # --workspace <name>`, which needs this root install to resolve.
      - name: Install workspace deps
        run: npm install

      - name: Install docs-site deps
        run: npm ci
        working-directory: pixi-rn/docs-site

      - name: Build guide site (Fumadocs + embedded API reference)
        run: npm run build
        working-directory: pixi-rn/docs-site
        env:
          # GitHub Pages serves a project site under /<repo>/, not the domain
          # root — see docs-site/next.config.mjs for why this is conditional.
          GH_PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pixi-rn/docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
